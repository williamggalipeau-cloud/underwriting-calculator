name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build and deploy are separate jobs (GitHub's recommended layout).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub sometimes doesn't list a just-uploaded site package yet, and the
      # deploy fails with "No artifacts named github-pages were found" though
      # the upload succeeded (11/24 three times, 11/25 once; a re-run minutes
      # later always worked). So: if the first try fails, wait a minute and
      # try once more. A second failure fails the run as before.
      - id: first
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait for the site package to be listed
        if: steps.first.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v5
      - id: deployment
        name: Deployed URL
        run: echo "page_url=${{ steps.first.outputs.page_url || steps.retry.outputs.page_url }}" >> "$GITHUB_OUTPUT"
